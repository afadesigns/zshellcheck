name: Release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Cosign uses a different identity from the provenance signer.
      packages: write
    outputs:
      subjects: ${{ steps.subjects.outputs.checksums }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: true
          cache: false
      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Cosign (for keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'
      - name: Set up QEMU (for cross-arch Docker builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect provenance subjects
        id: subjects
        shell: bash
        run: |
          cd dist
          test -s checksums.txt
          sha256sum --check checksums.txt
          {
            cat checksums.txt
            sha256sum checksums.txt
          } > "$RUNNER_TEMP/subjects.txt"
          printf 'checksums=%s\n' "$(base64 -w0 "$RUNNER_TEMP/subjects.txt")" >> "$GITHUB_OUTPUT"

  provenance:
    needs: goreleaser
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-provenance.yml
    with:
      subjects: ${{ needs.goreleaser.outputs.subjects }}

  publish:
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Verify draft assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECTS: ${{ needs.goreleaser.outputs.subjects }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mkdir "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
          printf '%s' "$SUBJECTS" | base64 --decode > "$RUNNER_TEMP/subjects.txt"
          cd "$RUNNER_TEMP/release"
          python3 - <<'PY'
          import os
          import pathlib

          manifest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'subjects.txt'
          expected = {line.split('  ', 1)[1] for line in manifest.read_text().splitlines()}
          actual = set()
          for asset in pathlib.Path('.').iterdir():
              if not asset.is_file():
                  raise SystemExit('Unexpected release directory: ' + asset.name)
              if asset.name != 'zshellcheck-provenance.json' and not asset.name.endswith(('.pem', '.sig')):
                  actual.add(asset.name)
          if actual != expected:
              raise SystemExit('Release assets do not match provenance subjects')
          PY
          sha256sum --check "$RUNNER_TEMP/subjects.txt"
          while read -r digest file; do
            test -n "$digest"
            gh attestation verify "$file" --bundle zshellcheck-provenance.json \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-provenance.yml@$GITHUB_REF" \
              --signer-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
            test -s "$file.pem"
            test -s "$file.sig"
          done < "$RUNNER_TEMP/subjects.txt"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
